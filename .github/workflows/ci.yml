name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tutorial
          POSTGRES_PASSWORD: tutorial
          POSTGRES_DB: nestjs_tutorial_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ci
        env:
          NODE_ENV: test
          APP_PORT: 3001
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: tutorial
          DB_PASS: tutorial
          DB_NAME: nestjs_tutorial_test
          JWT_SECRET: test-secret
          JWT_EXPIRES_IN: 1h
